<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experiment — Symbiote Engulf</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #dedfdf; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #horse {
    position: absolute; left: 50%; top: 47%; transform: translate(-50%, -50%);
    max-width: 94vw; max-height: 84vh; display: block;
    user-select: none; -webkit-user-select: none; -webkit-user-drag: none;
  }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .hint {
    position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%);
    font: 13px/1.5 -apple-system, 'Segoe UI', sans-serif; color: #555;
    display: flex; align-items: center; gap: 8px; pointer-events: none;
    white-space: nowrap;
  }
  .hint .dot { width: 8px; height: 8px; border-radius: 50%; background: #111; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
</style>
</head>
<body>
<div id="stage">
  <img id="horse" src="horse.jpg?v=1" alt="Horse" draggable="false">
  <canvas id="fx"></canvas>
  <div class="hint"><span class="dot"></span>Place your cursor on the horse</div>
</div>
<script>
(function () {
  'use strict';

  var stage = document.getElementById('stage');
  var img = document.getElementById('horse');
  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  if (!ctx) return; // graceful: plain image with no effect

  // Offscreen goo layer at reduced resolution for smooth 60fps on phones.
  var SCALE = 0.5;
  var goo = document.createElement('canvas');
  var gx = goo.getContext('2d');
  var W = 0, H = 0;

  function resize() {
    W = stage.clientWidth; H = stage.clientHeight;
    canvas.width = W; canvas.height = H;
    goo.width = Math.max(2, Math.round(W * SCALE));
    goo.height = Math.max(2, Math.round(H * SCALE));
  }
  window.addEventListener('resize', resize);
  resize();

  function clamp(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function smooth(x) { x = clamp(x); return x * x * (3 - 2 * x); }
  function imgRect() { return img.getBoundingClientRect(); }

  // ---- horse silhouette mask (white = horse), sampled to a small grid ----
  var MG = 100, maskGrid = null, maskImg = new Image(), maskReady = false;
  maskImg.src = 'horse-mask.png?v=1';
  maskImg.onload = function () {
    try {
      var mc = document.createElement('canvas');
      mc.width = MG; mc.height = MG;
      var mctx = mc.getContext('2d');
      mctx.drawImage(maskImg, 0, 0, MG, MG);
      var d = mctx.getImageData(0, 0, MG, MG).data;
      maskGrid = new Uint8Array(MG * MG);
      for (var i = 0; i < MG * MG; i++) maskGrid[i] = d[i * 4] > 127 ? 1 : 0;
      maskReady = true;
      buildSeeds();
    } catch (e) { /* fallback: seeds across whole image */ }
  };
  maskImg.onerror = function () { buildSeeds(); };

  function inHorse(u, v) {
    if (!maskGrid) return true;
    var ix = Math.min(MG - 1, Math.max(0, Math.floor(u * MG)));
    var iy = Math.min(MG - 1, Math.max(0, Math.floor(v * MG)));
    return maskGrid[iy * MG + ix] === 1;
  }

  // ---- seeds: jittered grid over the horse; wavefront spreads from contact ----
  var seeds = [];
  var contact = { u: 0.5, v: 0.35 };

  function makeVein() {
    var pts = [[0, 0]], a = Math.random() * Math.PI * 2;
    for (var k = 0; k < 4; k++) {
      a += (Math.random() - 0.5) * 1.6;
      var l = 0.02 + Math.random() * 0.035;
      pts.push([pts[k][0] + Math.cos(a) * l, pts[k][1] + Math.sin(a) * l]);
    }
    return pts;
  }

  function buildSeeds() {
    seeds = [];
    var N = 8, gx2, gy;
    for (gy = 0; gy < N; gy++) {
      for (gx2 = 0; gx2 < N; gx2++) {
        var u = (gx2 + 0.5) / N + (Math.random() - 0.5) * 0.09;
        var v = (gy + 0.5) / N + (Math.random() - 0.5) * 0.09;
        if (u < 0 || u > 1 || v < 0 || v > 1) continue;
        if (!inHorse(u, v)) continue;
        seeds.push({
          u: u, v: v, delay: 0,
          vein: Math.random() < 0.35 ? makeVein() : null,
          spikes: [Math.random() * Math.PI * 2, Math.random() * Math.PI * 2],
          wob: Math.random() * 1000
        });
      }
    }
    computeDelays();
  }

  function computeDelays() {
    var maxD = 0.0001, ds = [], i, d, dx, dy;
    for (i = 0; i < seeds.length; i++) {
      dx = seeds[i].u - contact.u;
      dy = seeds[i].v - contact.v;
      d = Math.sqrt(dx * dx + dy * dy);
      ds.push(d);
      if (d > maxD) maxD = d;
    }
    for (i = 0; i < seeds.length; i++) seeds[i].delay = ds[i] / maxD;
  }

  // ---- animation state: cover scrubs 0 (horse) -> 1 (engulfed) ----
  var cover = 0, target = 0, last = performance.now();

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    var step = target > cover ? dt / 2.8 : dt / 1.8; // engulf ~2.8s, recede ~1.8s
    if (cover < target) cover = Math.min(target, cover + step);
    else if (cover > target) cover = Math.max(target, cover - step);
    draw(now / 1000);
    requestAnimationFrame(frame);
  }

  function seedGrowth(s) {
    return smooth((cover - s.delay * 0.72) / 0.28);
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    if (cover <= 0.001 && target === 0) return;
    var r = imgRect();
    var gw = goo.width, gh = goo.height;
    gx.clearRect(0, 0, gw, gh);
    gx.save();
    gx.scale(SCALE, SCALE);

    var cell = Math.max(r.width, r.height) / 8;
    var maxR = cell * 0.85;
    var i, k, s, g, sx, sy, rad, grad;

    // black glossy blobs
    for (i = 0; i < seeds.length; i++) {
      s = seeds[i];
      g = seedGrowth(s);
      if (g <= 0.001) continue;
      sx = r.left + s.u * r.width;
      sy = r.top + s.v * r.height;
      rad = maxR * g;
      grad = gx.createRadialGradient(sx, sy, rad * 0.15, sx, sy, rad);
      grad.addColorStop(0, '#121216');
      grad.addColorStop(0.55, '#0a0a0d');
      grad.addColorStop(1, '#060608');
      gx.fillStyle = grad;
      gx.beginPath();
      gx.arc(sx, sy, rad, 0, 7);
      gx.fill();
      // spikes extruding at the wavefront
      if (g > 0.12 && g < 0.92) {
        gx.fillStyle = '#08080a';
        for (k = 0; k < 2; k++) {
          var a = s.spikes[k] + Math.sin(t * 3 + s.wob) * 0.12;
          var len = rad * (0.9 + 0.5 * Math.sin(t * 5 + s.wob + k * 2));
          var bx = sx + Math.cos(a) * rad * 0.7;
          var by = sy + Math.sin(a) * rad * 0.7;
          var tx = sx + Math.cos(a) * (rad + len);
          var ty = sy + Math.sin(a) * (rad + len);
          var px = -Math.sin(a), py = Math.cos(a);
          var wdt = rad * 0.28 * (1 - g * 0.4);
          gx.beginPath();
          gx.moveTo(bx + px * wdt, by + py * wdt);
          gx.lineTo(tx, ty);
          gx.lineTo(bx - px * wdt, by - py * wdt);
          gx.closePath();
          gx.fill();
        }
      }
    }

    // white veins, visible only where goo is
    gx.globalCompositeOperation = 'source-atop';
    gx.strokeStyle = 'rgba(235,235,240,0.5)';
    gx.lineWidth = Math.max(1, r.width * 0.0022);
    gx.lineCap = 'round';
    for (i = 0; i < seeds.length; i++) {
      s = seeds[i];
      if (!s.vein) continue;
      g = seedGrowth(s);
      if (g <= 0.01) continue;
      var ox = r.left + s.u * r.width, oy = r.top + s.v * r.height;
      gx.globalAlpha = 0.5 * g * (0.75 + 0.25 * Math.sin(t * 2.2 + s.wob));
      gx.beginPath();
      for (var p = 0; p < s.vein.length; p++) {
        var vx = ox + s.vein[p][0] * r.width;
        var vy = oy + s.vein[p][1] * r.width;
        if (p === 0) gx.moveTo(vx, vy); else gx.lineTo(vx, vy);
      }
      gx.stroke();
    }
    gx.globalAlpha = 1;

    // wet gloss sweep
    var gl = gx.createLinearGradient(r.left, r.top, r.left + r.width, r.top + r.height);
    gl.addColorStop(0, 'rgba(255,255,255,0.10)');
    gl.addColorStop(0.4, 'rgba(255,255,255,0.02)');
    gl.addColorStop(1, 'rgba(255,255,255,0)');
    gx.fillStyle = gl;
    gx.fillRect(r.left - maxR, r.top - maxR, r.width + maxR * 2, r.height + maxR * 2);
    gx.globalCompositeOperation = 'source-over';
    gx.restore();

    // clip goo to the horse silhouette
    if (maskReady) {
      gx.save();
      gx.globalCompositeOperation = 'destination-in';
      gx.drawImage(maskImg, r.left * SCALE, r.top * SCALE, r.width * SCALE, r.height * SCALE);
      gx.restore();
    }

    ctx.drawImage(goo, 0, 0, W, H);
  }

  // ---- interaction: cursor on the horse triggers the engulf ----
  function pointInImg(x, y) {
    var r = imgRect();
    return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  }
  function setContact(x, y) {
    var r = imgRect();
    contact.u = (x - r.left) / r.width;
    contact.v = (y - r.top) / r.height;
    computeDelays();
  }

  stage.addEventListener('pointermove', function (e) {
    if (pointInImg(e.clientX, e.clientY)) {
      setContact(e.clientX, e.clientY);
      target = 1;
    } else if (target !== 0) {
      target = 0;
    }
  }, { passive: true });

  stage.addEventListener('pointerleave', function () { target = 0; });

  stage.addEventListener('pointerdown', function (e) {
    if (pointInImg(e.clientX, e.clientY)) {
      setContact(e.clientX, e.clientY);
      target = target === 1 ? 0 : 1; // touch: tap toggles
    }
  });

  buildSeeds();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
