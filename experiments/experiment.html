<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experiment — Custom Effects Playground</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f4f1ea; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hint {
    position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%);
    font: 13px/1.5 -apple-system, 'Segoe UI', sans-serif; color: #555;
    display: flex; align-items: center; gap: 8px; pointer-events: none;
    white-space: nowrap;
  }
  .hint .dot { width: 8px; height: 8px; border-radius: 50%; background: #111; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  .fallback {
    position: absolute; object-fit: contain; display: none; pointer-events: none;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="pv-canvas"></canvas>
  <img class="fallback" id="pv-fallback" alt="">
  <div class="hint"><span class="dot"></span>Move across the form</div>
</div>
<script src="liquid-engine-experiment.js?v=1"></script>
<script>
(function () {
  'use strict';
  var stage = document.getElementById('stage');
  var canvas = document.getElementById('pv-canvas');
  if (typeof LiquidEngine === 'undefined') return;

  var engine = new LiquidEngine(canvas, {
    interactive: true, strength: 1, radius: 220, density: 1, dotSize: 1,
    spread: 1, turbulence: 1, returnSpeed: 1, streaks: true, restStyle: 'image',
    ambient: false, ambientIntensity: 1, speed: 1, intro: false, reducedMotion: false,
    bg: [0.957, 0.945, 0.918], imgBg: null, liquid: 1
  }, function () {
    var f = document.getElementById('pv-fallback');
    f.src = 'fist.jpg?v=1';
    f.style.display = 'block';
  });

  var aspect = 1;
  var img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = 'fist.jpg?v=1';


  // PUNCH EFFECT: the fist travels across the screen toward the cursor,
  // strikes, shakes on impact, then retracts — a real punching motion.
  var restRect = null;
  var punchAnim = null;
  var lastPunch = 0;
  function triggerPunch(mx, my) {
    var now = performance.now();
    if (punchAnim || !restRect || now - lastPunch < 1100) return;
    lastPunch = now;
    var fx = restRect.x + restRect.w / 2;
    var fy = restRect.y + restRect.h / 2;
    punchAnim = {
      start: now, dur: 780,
      fx: fx, fy: fy,
      tx: fx + (mx - fx) * 0.55,   // punch 55% of the way to the cursor
      ty: fy + (my - fy) * 0.55
    };
    requestAnimationFrame(punchFrame);
  }
  function punchFrame(now) {
    if (!punchAnim) return;
    var a = punchAnim;
    var t = (now - a.start) / a.dur;
    var W = stage.clientWidth, H = stage.clientHeight;
    if (t >= 1) {
      punchAnim = null;
      engine.resize(W, H, restRect);
      return;
    }
    var cx, cy, s;
    if (t < 0.22) {
      // STRIKE: fist flies toward the cursor, growing as it nears
      var k = t / 0.22, e = 1 - Math.pow(1 - k, 3);
      cx = a.fx + (a.tx - a.fx) * e;
      cy = a.fy + (a.ty - a.fy) * e;
      s = 1 + 0.55 * e;
    } else if (t < 0.34) {
      // IMPACT: shake on contact
      var k2 = (t - 0.22) / 0.12;
      cx = a.tx + Math.sin(k2 * Math.PI * 3) * 9 * (1 - k2);
      cy = a.ty + Math.cos(k2 * Math.PI * 3) * 9 * (1 - k2);
      s = 1.55;
    } else {
      // RETRACT: ease back to rest
      var k3 = (t - 0.34) / 0.66, e3 = 1 - Math.pow(1 - k3, 2);
      cx = a.tx + (a.fx - a.tx) * e3;
      cy = a.ty + (a.fy - a.ty) * e3;
      s = 1.55 - 0.55 * e3;
    }
    var w = restRect.w * s, h = restRect.h * s;
    engine.resize(W, H, { x: cx - w / 2, y: cy - h / 2, w: w, h: h });
    requestAnimationFrame(punchFrame);
  }

  function layout() {
    var w = stage.clientWidth, h = stage.clientHeight;
    var bandTop = h * 0.05, bandBottom = h * 0.88;
    var bandH = bandBottom - bandTop;
    var rw = w * 1.02, maxH = bandH * 1.1;
    if (rw / aspect > maxH) rw = maxH * aspect;
    var rh = rw / aspect;
    var cx = w * 0.5, cy = (bandTop + bandBottom) / 2;
    restRect = { x: cx - rw / 2, y: cy - rh / 2, w: rw, h: rh };
    if (!punchAnim) engine.resize(w, h, restRect);
    var f = document.getElementById('pv-fallback');
    f.style.left = (cx - rw / 2) + 'px';
    f.style.top = (cy - rh / 2) + 'px';
    f.style.width = rw + 'px';
    f.style.height = rh + 'px';
  }

  img.onload = function () {
    try {
      aspect = img.naturalWidth / img.naturalHeight || aspect;
      engine.setImage(img);
      layout();
    } catch (e) { /* fallback shows */ }
  };

  ['pointermove', 'pointerdown'].forEach(function (ev) {
    stage.addEventListener(ev, function (e) {
      var r = canvas.getBoundingClientRect();
      var mx = e.clientX - r.left, my = e.clientY - r.top;
      engine.pointer(ev === 'pointermove' ? 'move' : 'down', mx, my, e.pointerType === 'touch');
      // cursor placed on the fist -> punch
      var dx = (mx - r.width / 2) / (r.width / 2);
      var dy = (my - r.height / 2) / (r.height / 2);
      if (dx * dx + dy * dy < 0.55) triggerPunch(mx, my);
    }, { passive: true });
  });

  stage.addEventListener('pointerup', function (e) {
    var r = canvas.getBoundingClientRect();
    engine.pointer('up', e.clientX - r.left, e.clientY - r.top, e.pointerType === 'touch');
  });
  stage.addEventListener('pointerleave', function (e) {
    var r = canvas.getBoundingClientRect();
    engine.pointer('leave', e.clientX - r.left, e.clientY - r.top, false);
  });

  new ResizeObserver(layout).observe(stage);
  window.addEventListener('resize', layout);
  layout();
})();
</script>
</body>
</html>
