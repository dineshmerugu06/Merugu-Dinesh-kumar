<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experiment — Custom Effects Playground</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f4f1ea; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hint {
    position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%);
    font: 13px/1.5 -apple-system, 'Segoe UI', sans-serif; color: #555;
    display: flex; align-items: center; gap: 8px; pointer-events: none;
    white-space: nowrap;
  }
  .hint .dot { width: 8px; height: 8px; border-radius: 50%; background: #111; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  .fallback {
    position: absolute; object-fit: contain; display: none; pointer-events: none;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="pv-canvas"></canvas>
  <img class="fallback" id="pv-fallback" alt="">
  <div class="hint"><span class="dot"></span>Move across the form</div>
</div>
<script src="liquid-engine-experiment.js?v=1"></script>
<script>
(function () {
  'use strict';
  var stage = document.getElementById('stage');
  var canvas = document.getElementById('pv-canvas');
  if (typeof LiquidEngine === 'undefined') return;

  var engine = new LiquidEngine(canvas, {
    interactive: true, strength: 1, radius: 220, density: 1, dotSize: 1,
    spread: 1, turbulence: 1, returnSpeed: 1, streaks: true, restStyle: 'image',
    ambient: false, ambientIntensity: 1, speed: 1, intro: false, reducedMotion: false,
    bg: [0.957, 0.945, 0.918], imgBg: null, liquid: 1
  }, function () {
    var f = document.getElementById('pv-fallback');
    f.src = 'fist.jpg?v=1';
    f.style.display = 'block';
  });

  var aspect = 1;
  var img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = 'fist.jpg?v=1';


  // PUNCH EFFECT: fist lunges at the viewer when the cursor is placed on it.
  var punchT = 0;        // 0 = rest, 1 = full punch
  var punching = false;
  var lastPunch = 0;
  function triggerPunch() {
    var now = performance.now();
    if (punching || now - lastPunch < 900) return;
    punching = true;
    lastPunch = now;
  }
  // punch timeline: fast out (140ms), elastic back (650ms)
  function punchScale(t) {
    if (t < 0.18) return 1 + (t / 0.18) * 0.45;                    // lunge out
    var k = (t - 0.18) / 0.82;                                     // spring back
    return 1 + 0.45 * Math.cos(k * Math.PI * 2.5) * (1 - k) * Math.exp(-2 * k);
  }
  var punchStart = 0;
  function tickPunch(now) {
    if (punching) {
      var t = (now - punchStart) / 790;
      if (t >= 1) { punching = false; punchT = 0; }
      else punchT = punchScale(t);
      layout();
    }
    requestAnimationFrame(tickPunch);
  }

  function layout() {
    var w = stage.clientWidth, h = stage.clientHeight;
    var bandTop = h * 0.05, bandBottom = h * 0.88;
    var bandH = bandBottom - bandTop;
    var rw = w * 1.02, maxH = bandH * 1.1;
    if (rw / aspect > maxH) rw = maxH * aspect;
    var rh = rw / aspect;
    var cx = w * 0.5, cy = (bandTop + bandBottom) / 2;
    var s = punching ? punchT : 1;
    var pw2 = rw * s, ph2 = rh * s;
    engine.resize(w, h, { x: cx - pw2 / 2, y: cy - ph2 / 2, w: pw2, h: ph2 });
    var f = document.getElementById('pv-fallback');
    f.style.left = (cx - rw / 2) + 'px';
    f.style.top = (cy - rh / 2) + 'px';
    f.style.width = rw + 'px';
    f.style.height = rh + 'px';
  }

  img.onload = function () {
    try {
      aspect = img.naturalWidth / img.naturalHeight || aspect;
      engine.setImage(img);
      layout();
    } catch (e) { /* fallback shows */ }
  };

  ['pointermove', 'pointerdown'].forEach(function (ev) {
    stage.addEventListener(ev, function (e) {
      var r = canvas.getBoundingClientRect();
      var mx = e.clientX - r.left, my = e.clientY - r.top;
      engine.pointer(ev === 'pointermove' ? 'move' : 'down', mx, my, e.pointerType === 'touch');
      // cursor placed on the fist -> punch
      var dx = (mx - r.width / 2) / (r.width / 2);
      var dy = (my - r.height / 2) / (r.height / 2);
      if (dx * dx + dy * dy < 0.55) {
        if (!punching) punchStart = performance.now();
        triggerPunch();
      }
    }, { passive: true });
  });
  requestAnimationFrame(tickPunch);
  stage.addEventListener('pointerup', function (e) {
    var r = canvas.getBoundingClientRect();
    engine.pointer('up', e.clientX - r.left, e.clientY - r.top, e.pointerType === 'touch');
  });
  stage.addEventListener('pointerleave', function (e) {
    var r = canvas.getBoundingClientRect();
    engine.pointer('leave', e.clientX - r.left, e.clientY - r.top, false);
  });

  new ResizeObserver(layout).observe(stage);
  window.addEventListener('resize', layout);
  layout();
})();
</script>
</body>
</html>
